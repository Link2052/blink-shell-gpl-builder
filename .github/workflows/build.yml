name: Build Blink Shell (GPL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Manually Clone Code Base
        run: |
          git clone --recursive https://github.com{{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Make Script Executable & Compile
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/*.ipa

