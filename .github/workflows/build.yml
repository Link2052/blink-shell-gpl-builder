name: Build Blink Shell (GPL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Fetch Official Raw Blink Source Code
        run: |
          # Clones the raw, uncorrupted official code directly from the creators
          git clone --recursive --depth 1 https://github.com/blinksh/blink.git .
          
          # Downloads Blink's native precompiled frameworks (OpenSSL, libssh2, etc.)
          chmod +x ./build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh
          
          # Cleans up shared workspace data that forces paid team constraints
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Force Compile Open-Source Unsigned IPA
        run: |
          mkdir -p dist
          
          # Compiles the pristine project file while passing the native GPL switch 
          xcodebuild -project Blink.xcodeproj \
                     -scheme Blink \
                     -configuration Release \
                     -sdk iphoneos \
                     GCC_PREPROCESSOR_DEFINITIONS='$(inherited) GPL=1' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Packages the output app structure into an iOS Payload directory
          mkdir -p dist/Payload
          cp -r build/Release-iphoneos/Blink.app dist/Payload/ || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Blink.app dist/Payload/
          
          cd dist
          zip -r Blink.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/Blink.ipa

