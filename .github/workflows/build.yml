name: Build Blink Shell (GPL)

on:
  workflow_dispatch: # Allows you to trigger this manually with a button click

jobs:
  build:
    runs-on: macos-14 # Provisions an official cloud Apple Silicon Mac
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Make Script Executable & Compile
        run: |
          chmod +x ./build.sh
          ./build.sh
        # Note: The NewsGuyTor repository executes its tasks inside build.sh

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/*.ipa # Grabs the resulting iPad installation file
