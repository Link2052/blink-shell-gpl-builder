name: Build Blink Shell (GPL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository Natively
        uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install System Dependencies
        run: brew install jq # Installs the JSON parser required by your fork's script

      - name: Execute Sideload Build Script
        env:
          # Sets a dummy team ID so the script compiles without a paid Apple account
          TEAM_ID: "1234567890" 
          # Forces Xcode to compile raw unsigned binaries
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          chmod +x ./build-blink-shell-gpl.sh
          ./build-blink-shell-gpl.sh

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/*.ipa # Collects the final .ipa file generated by your script
