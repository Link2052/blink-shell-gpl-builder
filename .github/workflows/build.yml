name: Build Blink Shell (GPL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Provisions an Apple Silicon Runner
    steps:
      - name: Fetch Official Raw Blink Source Code
        run: |
          git clone --recursive --depth 1 https://github.com .
          
          chmod +x ./get_frameworks.sh
          ./get_frameworks.sh
          
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      - name: Set up Modern Xcode Version
        # Updates the builder environment to utilize Xcode 16.0 to handle project format 70
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Force Compile Open-Source Unsigned IPA
        run: |
          mkdir -p dist
          
          xcodebuild -project Blink.xcodeproj \
                     -scheme Blink \
                     -configuration Release \
                     -sdk iphoneos \
                     GCC_PREPROCESSOR_DEFINITIONS='$(inherited) GPL=1' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          mkdir -p dist/Payload
          cp -r build/Release-iphoneos/Blink.app dist/Payload/ || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Blink.app dist/Payload/
          
          cd dist
          zip -r Blink.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/Blink.ipa
