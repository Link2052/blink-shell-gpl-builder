name: Build Blink Shell (GPL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Fetch Official Raw Blink Source Code
        run: |
          # Clones the raw, uncorrupted official code directly from the creators
          git clone --recursive --depth 1 https://github.com/blinksh/blink.git .
          
          # Downloads Blink's native precompiled frameworks (OpenSSL, libssh2, etc.)
          chmod +x ./get_frameworks.sh
          ./get_frameworks.sh
          
          # Cleans up shared workspace data that forces paid team constraints
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

          # Deduplicates the Mosh picker asset layout to stop the Xcode 16 compilation crash
          sed -i '' '/MoshCustomOptionsPickerView.swift/d' Blink.xcodeproj/project.pbxproj

          # Creates the missing base configuration file required by the Xcode project layout
          touch developer_setup.xcconfig

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Force Compile Open-Source App Components
        run: |
          # The "|| true" suffix forces the script to proceed even if the secondary extensions fail compiling
          xcodebuild -project Blink.xcodeproj \
                     -scheme Blink \
                     -configuration Release \
                     -sdk iphoneos \
                     GCC_PREPROCESSOR_DEFINITIONS='$(inherited) GPL=1' \
                     SWIFT_VERSION=5 \
                     SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
                     SUPPORTS_MACCATALYST=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_IDENTITY="" \
                     clean build || true

      - name: Package Successfully Compiled Binary Payload
        run: |
          mkdir -p dist/Payload
          
          # Extracts the completed main application bundle directly from the DerivedData cache
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Blink.app dist/Payload/
          
          # Verifies the payload directory is populated before compressing
          if [ -d "dist/Payload/Blink.app" ]; then
            echo "Success! Core app found. Zipping installation payload..."
            cd dist
            zip -r Blink.ipa Payload
          else
            echo "Error: Core binary was missing from cache files."
            exit 1
          fi

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: Blink-Shell-GPL
          path: dist/Blink.ipa
